<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="forest@isle:~$ whoami — Forest Isle, between the kernel and the model">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- window body -->
  <rect x="4" y="4" width="712" height="292" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <path d="M4 16 a12 12 0 0 1 12 -12 H704 a12 12 0 0 1 12 12 V48 H4 Z" fill="#161b22"/>
  <line x1="4" y1="48" x2="716" y2="48" stroke="#30363d" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="26" r="6" fill="#27c93f"/>

  <!-- title -->
  <text class="mono" x="360" y="31" text-anchor="middle" font-size="14" fill="#8b949e" letter-spacing="1">forest@isle: ~</text>

  <!-- prompt -->
  <text class="mono" x="40" y="106" font-size="18">
    <tspan fill="#00d4ff">$</tspan><tspan fill="#c9d1d9" dx="10">whoami</tspan>
  </text>

  <!-- name -->
  <text class="mono" x="40" y="158" font-size="34" font-weight="700">
    <tspan fill="#d4b483">▸</tspan><tspan fill="#00d4ff" dx="14" filter="url(#glow)">Forest Isle</tspan>
  </text>

  <!-- tagline -->
  <text class="mono" x="40" y="200" font-size="16">
    <tspan fill="#d4b483">▸</tspan><tspan fill="#8b949e" dx="14">between the kernel and the model</tspan>
  </text>

  <!-- live prompt + blinking cursor -->
  <text class="mono" x="40" y="252" font-size="18" fill="#00d4ff">$</text>
  <rect x="62" y="237" width="11" height="20" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
