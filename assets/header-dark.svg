<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.15"/>
    </pattern>

    <!-- Neon glow filters -->
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glitchShift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="3" dy="0" result="shift1"/>
      <feOffset in="blur" dx="-2" dy="1" result="shift2"/>
      <feMerge>
        <feMergeNode in="shift1"/>
        <feMergeNode in="shift2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow animation -->
    <style>
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.6 } }
      @keyframes flicker { 0% { opacity:0.9 } 5% { opacity:0.4 } 10% { opacity:1 } 40% { opacity:0.8 } 42% { opacity:0.3 } 44% { opacity:1 } 80% { opacity:1 } 82% { opacity:0.3 } 85% { opacity:1 } }
      @keyframes particle1 { 0% { transform:translate(0,0); opacity:0 } 20% { opacity:0.8 } 80% { opacity:0.3 } 100% { transform:translate(-15,-40); opacity:0 } }
      @keyframes particle2 { 0% { transform:translate(0,0); opacity:0 } 20% { opacity:0.9 } 70% { opacity:0.2 } 100% { transform:translate(25,-35); opacity:0 } }
      @keyframes particle3 { 0% { transform:translate(0,0); opacity:0 } 30% { opacity:0.7 } 80% { opacity:0.2 } 100% { transform:translate(-20,-30); opacity:0 } }
      @keyframes slideIn { 0% { transform:translate(-80,0); opacity:0 } 100% { transform:translate(0,0); opacity:1 } }
      @keyframes borderPulse { 0%,100% { stroke-opacity:1 } 50% { stroke-opacity:0.4 } }
      @keyframes scanMove { 0% { transform:translate(0,0) } 100% { transform:translate(0,380) } }
      .pulse { animation: pulse 1.5s ease-in-out infinite }
      .flicker { animation: flicker 3s ease-in-out infinite }
      .border-pulse { animation: borderPulse 2s ease-in-out infinite }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="380" rx="6" fill="#080c14"/>
  <rect x="0" y="0" width="900" height="380" rx="6" fill="url(#grid)"/>

  <!-- Animated scanline overlay -->
  <rect x="0" y="0" width="900" height="380" rx="6" fill="url(#scanlines)"/>

  <!-- Outer glow border -->
  <rect x="3" y="3" width="894" height="374" rx="6" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.6" class="border-pulse"/>
  <rect x="1" y="1" width="898" height="378" rx="6" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Terminal title bar -->
  <rect x="1" y="1" width="898" height="36" rx="6" fill="#0d1520"/>
  <rect x="1" y="20" width="898" height="17" fill="#0d1520"/>

  <!-- Traffic lights with glow -->
  <circle cx="18" cy="19" r="6" fill="#ff5f56">
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="19" r="6" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="450" y="25" text-anchor="middle" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12" fill="#6e7681">root@forest-isle:~</text>

  <!-- Decorative skull -->
  <text x="860" y="25" text-anchor="end" font-family="monospace" font-size="14" fill="#CC7832" filter="url(#neonAmber)" class="pulse">☠</text>

  <!-- ===== MAIN CONTENT ===== -->

  <!-- Prompt 1 -->
  <text x="24" y="70" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#CC7832">root</text>
  <text x="56" y="70" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8b949e">@</text>
  <text x="68" y="70" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#00D4FF" font-weight="bold">forest-isle</text>
  <text x="168" y="70" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#CC7832">:~</text>
  <text x="188" y="70" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#c9d1d9"># whoami</text>

  <!-- FOREST ISLE - massive neon -->
  <text x="450" y="150" text-anchor="middle" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="52" font-weight="900" fill="#00D4FF" filter="url(#neonCyan)" class="flicker">F O R E S T   I S L E</text>

  <!-- Glitch shadow of name -->
  <text x="455" y="152" text-anchor="middle" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="52" font-weight="900" fill="#CC7832" opacity="0.15" filter="url(#glitchShift)">F O R E S T   I S L E</text>

  <!-- Underline glow bar -->
  <rect x="160" y="168" width="580" height="2" rx="1" fill="#00D4FF" opacity="0.6" filter="url(#neonCyan)">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Prompts 2 -->
  <text x="24" y="210" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#CC7832">root</text>
  <text x="56" y="210" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8b949e">@</text>
  <text x="68" y="210" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#00D4FF" font-weight="bold">forest-isle</text>
  <text x="168" y="210" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#CC7832">:~</text>
  <text x="188" y="210" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#c9d1d9"># cat /etc/motd</text>

  <!-- MOTD -->
  <text x="24" y="242" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8b949e">▸ the stack is deep. i live between the kernel &amp; the void.</text>
  <text x="24" y="264" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#00D4FF" opacity="0.8">▸ building things that think. breaking things that defend.</text>
  <text x="24" y="286" font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8b949e">▸ low-level by choice. high-impact by design. not a job title — an obsession.</text>

  <!-- Tag pills -->
  <rect x="24" y="312" width="108" height="28" rx="4" fill="#00D4FF" opacity="0.1" stroke="#00D4FF" stroke-width="0.8"/>
  <text x="78" y="332" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">⚡ RED TEAM</text>

  <rect x="144" y="312" width="88" height="28" rx="4" fill="#CC7832" opacity="0.1" stroke="#CC7832" stroke-width="0.8"/>
  <text x="188" y="332" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#CC7832">☠ MALWARE</text>

  <rect x="244" y="312" width="80" height="28" rx="4" fill="#00D4FF" opacity="0.1" stroke="#00D4FF" stroke-width="0.8"/>
  <text x="284" y="332" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">⊞ KERNEL</text>

  <rect x="336" y="312" width="74" height="28" rx="4" fill="#CC7832" opacity="0.1" stroke="#CC7832" stroke-width="0.8"/>
  <text x="373" y="332" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#CC7832">🧠 LLM</text>

  <rect x="422" y="312" width="72" height="28" rx="4" fill="#00D4FF" opacity="0.1" stroke="#00D4FF" stroke-width="0.8"/>
  <text x="458" y="332" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">🦀 RUST</text>

  <!-- Animated cursor -->
  <rect x="268" y="298" width="10" height="14" fill="#00D4FF" opacity="0.8" filter="url(#neonCyan)">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle r="2" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.8;0.4;0" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="100" r="2" fill="#00D4FF" opacity="0.5"><animate attributeName="cy" values="100;60;100" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="80" r="1.5" fill="#CC7832" opacity="0.4"><animate attributeName="cy" values="80;40;80" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="140" r="2" fill="#00D4FF" opacity="0.3"><animate attributeName="cy" values="140;90;140" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="180" r="1.5" fill="#00D4FF" opacity="0.4"><animate attributeName="cy" values="180;120;180" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="120" r="2" fill="#CC7832" opacity="0.5"><animate attributeName="cy" values="120;70;120" dur="3.5s" repeatCount="indefinite"/></circle>

  <!-- Corner decorations -->
  <text x="8" y="370" font-family="monospace" font-size="8" fill="#1a1a2e">███▓▒░░</text>
  <text x="840" y="370" font-family="monospace" font-size="8" fill="#1a1a2e">░░▒▓███</text>
</svg>