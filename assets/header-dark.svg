  <rect x="262" y="340" width="88" height="30" rx="4" fill="#27c93f" opacity="0.06" stroke="#27c93f" stroke-width="0.8"/>
  <text x="306" y="360" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#27c93f" filter="url(#neonGreen)">⊞ KERNEL</text>

  <rect x="360" y="340" width="82" height="30" rx="4" fill="#CC7832" opacity="0.08" stroke="#CC7832" stroke-width="0.8"/>
