<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="dotGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="0.5" fill="#00D4FF" opacity="0.08"/>
    </pattern>
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.5" fill="#000000" opacity="0.12"/>
    </pattern>

    <filter id="neonCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur4"/>
      <feMerge>
        <feMergeNode in="blur4"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glitchBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feOffset in="blur" dx="4" dy="0" result="shiftR"/>
      <feOffset in="blur" dx="-3" dy="1" result="shiftB"/>
      <feMerge>
        <feMergeNode in="shiftR"/>
        <feMergeNode in="shiftB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glitchRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feOffset in="blur" dx="-4" dy="0" result="shiftR"/>
      <feOffset in="blur" dx="2" dy="-1" result="shiftB"/>
      <feMerge>
        <feMergeNode in="shiftR"/>
        <feMergeNode in="shiftB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
      @keyframes flicker { 0% { opacity:0.95 } 3% { opacity:0.3 } 6% { opacity:1 } 35% { opacity:0.9 } 37% { opacity:0.2 } 39% { opacity:1 } 70% { opacity:1 } 72% { opacity:0.25 } 74% { opacity:0.9 } }
      @keyframes borderPulse { 0%,100% { stroke-opacity:0.8 } 50% { stroke-opacity:0.25 } }
      @keyframes scanMove { 0% { transform:translate(0,0) } 100% { transform:translate(0,420) } }
      @keyframes glitchFlash { 0%,94%,96%,100% { opacity:0 } 95% { opacity:0.15 } }
      @keyframes matrixRain { 0% { transform:translate(0,-200); opacity:0 } 10% { opacity:0.6 } 90% { opacity:0.2 } 100% { transform:translate(0,420); opacity:0 } }
      @keyframes tagPulse1 { 0%,100% { opacity:0.9 } 25% { opacity:0.4 } }
      @keyframes tagPulse2 { 0%,100% { opacity:0.5 } 50% { opacity:0.9 } }
      @keyframes tagPulse3 { 0%,100% { opacity:0.9 } 33% { opacity:0.3 } }
      @keyframes cursorBlink { 0%,100% { opacity:0.9 } 50% { opacity:0 } }
      .p { animation: pulse 2s ease-in-out infinite }
      .f { animation: flicker 4s ease-in-out infinite }
      .bp { animation: borderPulse 2.5s ease-in-out infinite }
      .gf { animation: glitchFlash 6s ease-in-out infinite }
      .cb { animation: cursorBlink 0.7s steps(1) infinite }
      .tp1 { animation: tagPulse1 1.8s ease-in-out infinite }
      .tp2 { animation: tagPulse2 2.2s ease-in-out infinite 0.5s }
      .tp3 { animation: tagPulse3 1.5s ease-in-out infinite 1s }
    </style>
  </defs>

  <!-- Background layers -->
  <rect x="0" y="0" width="900" height="420" rx="5" fill="#060b11"/>
  <rect x="0" y="0" width="900" height="420" rx="5" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="420" rx="5" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="900" height="420" rx="5" fill="url(#scanlines)"/>

  <!-- Glitch flash overlay -->
  <rect x="0" y="0" width="900" height="420" rx="5" fill="#00D4FF" opacity="0" class="gf"/>

  <!-- Outer border -->
  <rect x="2" y="2" width="896" height="416" rx="5" fill="none" stroke="#00D4FF" stroke-width="1.2" opacity="0.5" class="bp"/>
  <rect x="1" y="1" width="898" height="418" rx="5" fill="none" stroke="#00D4FF" stroke-width="0.4" opacity="0.15"/>

  <!-- ===== MATRIX RAIN ===== -->
  <g font-family="monospace" font-size="11">
    <!-- Column 1 -->
    <text x="60" y="0" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.4;0.2;0" dur="6s" repeatCount="indefinite"/>
      <tspan x="60" dy="0">7A</tspan><tspan x="60" dy="14">3F</tspan><tspan x="60" dy="14">E2</tspan><tspan x="60" dy="14">91</tspan><tspan x="60" dy="14">B8</tspan><tspan x="60" dy="14">0D</tspan><tspan x="60" dy="14">F5</tspan><tspan x="60" dy="14">2C</tspan><tspan x="60" dy="14">A9</tspan><tspan x="60" dy="14">6E</tspan><tspan x="60" dy="14">D4</tspan><tspan x="60" dy="14">1B</tspan><tspan x="60" dy="14">88</tspan><tspan x="60" dy="14">FF</tspan><tspan x="60" dy="14">3A</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -280" to="0 420" dur="6s" repeatCount="indefinite"/>
    </text>
    <!-- Column 2 -->
    <text x="140" y="0" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.3;0.1;0" dur="7s" repeatCount="indefinite"/>
      <tspan x="140" dy="0">C4</tspan><tspan x="140" dy="14">9B</tspan><tspan x="140" dy="14">2E</tspan><tspan x="140" dy="14">77</tspan><tspan x="140" dy="14">A3</tspan><tspan x="140" dy="14">DF</tspan><tspan x="140" dy="14">05</tspan><tspan x="140" dy="14">BC</tspan><tspan x="140" dy="14">41</tspan><tspan x="140" dy="14">E8</tspan><tspan x="140" dy="14">6D</tspan><tspan x="140" dy="14">FA</tspan><tspan x="140" dy="14">19</tspan><tspan x="140" dy="14">32</tspan><tspan x="140" dy="14">87</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -300" to="0 420" dur="7s" repeatCount="indefinite"/>
    </text>
    <!-- Column 3 (amber) -->
    <text x="200" y="0" fill="#CC7832" opacity="0"><animate attributeName="opacity" values="0;0.5;0.2;0" dur="5s" repeatCount="indefinite"/>
      <tspan x="200" dy="0">5D</tspan><tspan x="200" dy="14">1A</tspan><tspan x="200" dy="14">CE</tspan><tspan x="200" dy="14">84</tspan><tspan x="200" dy="14">F3</tspan><tspan x="200" dy="14">29</tspan><tspan x="200" dy="14">B7</tspan><tspan x="200" dy="14">0E</tspan><tspan x="200" dy="14">AA</tspan><tspan x="200" dy="14">66</tspan><tspan x="200" dy="14">D9</tspan><tspan x="200" dy="14">1F</tspan><tspan x="200" dy="14">40</tspan><tspan x="200" dy="14">EB</tspan><tspan x="200" dy="14">7C</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -250" to="0 420" dur="5s" repeatCount="indefinite"/>
    </text>
    <!-- Column 4 -->
    <text x="760" y="0" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.35;0.15;0" dur="8s" repeatCount="indefinite"/>
      <tspan x="760" dy="0">4B</tspan><tspan x="760" dy="14">E7</tspan><tspan x="760" dy="14">12</tspan><tspan x="760" dy="14">9C</tspan><tspan x="760" dy="14">D1</tspan><tspan x="760" dy="14">58</tspan><tspan x="760" dy="14">AF</tspan><tspan x="760" dy="14">36</tspan><tspan x="760" dy="14">0B</tspan><tspan x="760" dy="14">CC</tspan><tspan x="760" dy="14">7F</tspan><tspan x="760" dy="14">24</tspan><tspan x="760" dy="14">B2</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -260" to="0 420" dur="8s" repeatCount="indefinite"/>
    </text>
    <!-- Column 5 (green) -->
    <text x="820" y="0" fill="#27c93f" opacity="0"><animate attributeName="opacity" values="0;0.45;0.15;0" dur="6.5s" repeatCount="indefinite"/>
      <tspan x="820" dy="0">8A</tspan><tspan x="820" dy="14">D3</tspan><tspan x="820" dy="14">6C</tspan><tspan x="820" dy="14">FE</tspan><tspan x="820" dy="14">17</tspan><tspan x="820" dy="14">49</tspan><tspan x="820" dy="14">B0</tspan><tspan x="820" dy="14">E5</tspan><tspan x="820" dy="14">2A</tspan><tspan x="820" dy="14">9F</tspan><tspan x="820" dy="14">71</tspan><tspan x="820" dy="14">C8</tspan><tspan x="820" dy="14">3D</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -220" to="0 420" dur="6.5s" repeatCount="indefinite"/>
    </text>
    <!-- Column 6 (amber) -->
    <text x="860" y="0" fill="#CC7832" opacity="0"><animate attributeName="opacity" values="0;0.5;0.2;0" dur="4.5s" repeatCount="indefinite"/>
      <tspan x="860" dy="0">D6</tspan><tspan x="860" dy="14">2F</tspan><tspan x="860" dy="14">A4</tspan><tspan x="860" dy="14">1C</tspan><tspan x="860" dy="14">B9</tspan><tspan x="860" dy="14">53</tspan><tspan x="860" dy="14">E0</tspan><tspan x="860" dy="14">8D</tspan><tspan x="860" dy="14">F8</tspan><tspan x="860" dy="14">06</tspan><tspan x="860" dy="14">3E</tspan><tspan x="860" dy="14">C1</tspan><tspan x="860" dy="14">AB</tspan><tspan x="860" dy="14">75</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -270" to="0 420" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===== TERMINAL TITLE BAR ===== -->
  <rect x="1" y="1" width="898" height="34" rx="5" fill="#0d1520"/>
  <rect x="1" y="19" width="898" height="16" fill="#0d1520"/>
  <circle cx="17" cy="18" r="5.5" fill="#ff5f56"><animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="35" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="53" cy="18" r="5.5" fill="#27c93f"><animate attributeName="opacity" values="1;0.5;1" dur="3.5s" repeatCount="indefinite"/></circle>
  <text x="450" y="24" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#6e7681">root@forest-isle:~</text>
  <text x="870" y="24" text-anchor="end" font-family="monospace" font-size="13" fill="#CC7832" filter="url(#neonAmber)" class="tp1">☠</text>

  <!-- ===== MAIN CONTENT ===== -->

  <!-- Prompt 1 -->
  <text x="28" y="75" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#CC7832">root</text>
  <text x="58" y="75" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#8b949e">@</text>
  <text x="70" y="75" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#00D4FF" font-weight="bold" filter="url(#neonCyan)">forest-isle</text>
  <text x="168" y="75" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#CC7832">:~</text>
  <text x="186" y="75" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#c9d1d9"># whoami</text>

  <!-- FOREST ISLE - massive neon with glitch -->
  <text x="452" y="158" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="54" font-weight="900" fill="#00D4FF" filter="url(#neonCyan)" class="f">F O R E S T   I S L E</text>
  <!-- Red glitch channel -->
  <text x="456" y="162" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="54" font-weight="900" fill="#DC143C" opacity="0.12" filter="url(#glitchRed)">F O R E S T   I S L E</text>
  <!-- Blue glitch channel -->
  <text x="448" y="156" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="54" font-weight="900" fill="#00D4FF" opacity="0.08" filter="url(#glitchBlue)">F O R E S T   I S L E</text>

  <!-- Glow underline -->
  <rect x="150" y="176" width="600" height="2" rx="1" fill="#00D4FF" opacity="0.5" filter="url(#neonCyan)">
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Prompts 2 -->
  <text x="28" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#CC7832">root</text>
  <text x="58" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#8b949e">@</text>
  <text x="70" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#00D4FF" font-weight="bold" filter="url(#neonCyan)">forest-isle</text>
  <text x="168" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#CC7832">:~</text>
  <text x="186" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#c9d1d9"># cat /etc/motd</text>

  <!-- MOTD -->
  <text x="28" y="256" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#8b949e">▸ the stack is deep. i live between the kernel &amp; the void.</text>
  <text x="28" y="278" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#00D4FF" opacity="0.85" class="tp2">▸ building things that think. breaking things that defend.</text>
  <text x="28" y="300" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#8b949e">▸ low-level by choice. high-impact by design.</text>

  <!-- Animated cursor -->
  <rect x="30" y="312" width="10" height="14" fill="#00D4FF" opacity="0" filter="url(#neonCyan)" class="cb"/>

  <!-- ===== TAG PILLS ===== -->
  <rect x="28" y="340" width="118" height="30" rx="4" fill="#00D4FF" opacity="0.08" stroke="#00D4FF" stroke-width="0.8"/>
  <text x="87" y="360" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF" filter="url(#neonCyan)">⚡ RED TEAM</text>

  <rect x="156" y="340" width="96" height="30" rx="4" fill="#CC7832" opacity="0.08" stroke="#CC7832" stroke-width="0.8"/>
