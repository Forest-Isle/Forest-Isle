  <rect x="452" y="340" width="80" height="30" rx="4" fill="#DC143C" opacity="0.06" stroke="#DC143C" stroke-width="0.8"/>
  <text x="492" y="360" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#DC143C" filter="url(#neonRed)">🦀 RUST</text>

  <rect x="542" y="340" width="74" height="30" rx="4" fill="#00D4FF" opacity="0.08" stroke="#00D4FF" stroke-width="0.8"/>
  <text x="579" y="360" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF" filter="url(#neonCyan)">🐍 PY</text>

  <!-- ===== FLOATING PARTICLES ===== -->
  <circle cx="100" cy="100" r="2.5" fill="#00D4FF" opacity="0">
