<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="auto">
  <defs>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b11"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>

    <style>
      @keyframes pulse { 0%,100% { opacity:0.8 } 50% { opacity:0.25 } }
      @keyframes typeBlink { 0%,100% { opacity:1 } 50% { opacity:0.3 } }
      @keyframes borderPulse { 0%,100% { stroke-opacity:0.6 } 50% { stroke-opacity:0.15 } }
      .p { animation: pulse 2s ease-in-out infinite }
      .tb { animation: typeBlink 1.5s ease-in-out infinite }
      .bp { animation: borderPulse 3s ease-in-out infinite }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="260" rx="4" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="258" rx="4" fill="none" stroke="#DC143C" stroke-width="0.8" opacity="0.4" class="bp"/>

  <!-- TOP SECRET stamp -->
  <rect x="620" y="15" width="165" height="36" rx="3" fill="#DC143C" opacity="0.1" stroke="#DC143C" stroke-width="1.5"/>
  <text x="702" y="32" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#DC143C">══ TOP SECRET ══</text>
  <text x="702" y="45" text-anchor="middle" font-family="monospace" font-size="8" fill="#DC143C">SI//TK//NOFORN</text>

  <!-- Header -->
  <text x="20" y="30" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#CC7832" filter="url(#glowAmber)">CLASSIFIED: ULTRAVIOLET</text>

  <!-- Divider -->
  <line x1="20" y1="40" x2="610" y2="40" stroke="#1a1a2e" stroke-width="0.8"/>

  <!-- Mission title -->
  <text x="400" y="68" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="16" fill="#00D4FF" filter="url(#glowCyan)" font-weight="bold">▶ ACTIVE OPERATIONS</text>

  <!-- Op 1 -->
  <rect x="20" y="85" width="760" height="38" rx="3" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.6"/>
  <text x="35" y="103" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">OP-001</text>
  <text x="110" y="103" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#c9d1d9">CHIMERA · EDR Evasion Framework</text>
  <rect x="510" y="93" width="80" height="18" rx="3" fill="#DC143C" opacity="0.15" stroke="#DC143C" stroke-width="0.6"/>
  <text x="550" y="107" text-anchor="middle" font-family="monospace" font-size="9" fill="#DC143C">CRITICAL</text>
  <text x="620" y="103" font-family="monospace" font-size="10" fill="#6e7681">PHASE:</text>
  <text x="670" y="103" font-family="monospace" font-size="11" fill="#27c93f" class="p">ACTIVE</text>
  <text x="730" y="103" font-family="monospace" font-size="10" fill="#CC7832" class="tb">■</text>

  <!-- Op 2 -->
  <rect x="20" y="128" width="760" height="38" rx="3" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.6"/>
  <text x="35" y="146" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">OP-002</text>
  <text x="110" y="146" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#c9d1d9">IRONCLAW · Red Team C2 Infrastructure</text>
  <rect x="510" y="136" width="70" height="18" rx="3" fill="#DC143C" opacity="0.1" stroke="#CC7832" stroke-width="0.6"/>
  <text x="545" y="150" text-anchor="middle" font-family="monospace" font-size="9" fill="#CC7832">SEVERE</text>
  <text x="620" y="146" font-family="monospace" font-size="10" fill="#6e7681">PHASE:</text>
  <text x="670" y="146" font-family="monospace" font-size="11" fill="#27c93f" class="p">ACTIVE</text>
  <text x="730" y="146" font-family="monospace" font-size="10" fill="#CC7832" class="tb">■</text>

  <!-- Op 3 -->
  <rect x="20" y="171" width="760" height="38" rx="3" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.6"/>
  <text x="35" y="189" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF">OP-003</text>
  <text x="110" y="189" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#c9d1d9">SYNAPSE · Multi-Agent AI Swarm</text>
  <rect x="510" y="179" width="65" height="18" rx="3" fill="#CC7832" opacity="0.08" stroke="#CC7832" stroke-width="0.6"/>
  <text x="542" y="193" text-anchor="middle" font-family="monospace" font-size="9" fill="#CC7832">HIGH</text>
  <text x="620" y="189" font-family="monospace" font-size="10" fill="#6e7681">PHASE:</text>
  <text x="670" y="189" font-family="monospace" font-size="11" fill="#00D4FF" class="p">DEVELOPING</text>
  <text x="730" y="189" font-family="monospace" font-size="10" fill="#00D4FF" class="tb">■</text>

  <!-- Bottom status bar -->
  <rect x="20" y="225" width="760" height="22" rx="3" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="35" y="240" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">COMSTAT:</text>
  <text x="110" y="240" font-family="monospace" font-size="10" fill="#27c93f">ALL_CHANNELS_GREEN</text>
  <text x="290" y="240" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">SIGINT:</text>
  <text x="350" y="240" font-family="monospace" font-size="10" fill="#00D4FF">MONITORING</text>
  <text x="480" y="240" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">ENCRYPTION:</text>
  <text x="580" y="240" font-family="monospace" font-size="10" fill="#CC7832">AES-256-GCM</text>
  <text x="695" y="240" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">UPTIME:</text>
  <text x="750" y="240" font-family="monospace" font-size="10" fill="#27c93f">99.97%</text>
</svg>