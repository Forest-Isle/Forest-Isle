<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="auto">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b11"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>

    <style>
      @keyframes borderPulse { 0%,100% { stroke-opacity:0.7 } 50% { stroke-opacity:0.2 } }
      @keyframes statusPulse { 0%,100% { opacity:0.9 } 30% { opacity:0.3 } }
      .bp { animation: borderPulse 2s ease-in-out infinite }
      .sp { animation: statusPulse 1.5s ease-in-out infinite }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="180" rx="5" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="178" rx="5" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="2" y="2" width="796" height="176" rx="5" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3" class="bp"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="28" rx="5" fill="#0d1520"/>
  <rect x="1" y="18" width="798" height="11" fill="#0d1520"/>
  <text x="400" y="20" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#CC7832" filter="url(#glow)">┌─ /var/log/battle-stats ──────────────────────────────────────┐</text>

  <!-- Stat panels -->
  <!-- Panel 1: Stars -->
  <rect x="20" y="42" width="175" height="60" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="107" y="66" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">★ TOTAL STARS</text>
  <text x="107" y="88" text-anchor="middle" font-family="'SF Mono',monospace" font-size="28" fill="#CC7832" font-weight="bold" filter="url(#glow)">81</text>

  <!-- Panel 2: Followers -->
  <rect x="210" y="42" width="175" height="60" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="297" y="66" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">◆ FOLLOWERS</text>
  <text x="297" y="88" text-anchor="middle" font-family="'SF Mono',monospace" font-size="28" fill="#00D4FF" font-weight="bold" filter="url(#glow)">1</text>

  <!-- Panel 3: Repos -->
  <rect x="400" y="42" width="175" height="60" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="487" y="66" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">⬡ REPOSITORIES</text>
  <text x="487" y="88" text-anchor="middle" font-family="'SF Mono',monospace" font-size="28" fill="#00D4FF" font-weight="bold" filter="url(#glow)">11</text>

  <!-- Panel 4: Status -->
  <rect x="590" y="42" width="190" height="60" rx="4" fill="#0d1520" stroke="#27c93f" stroke-width="0.8" opacity="0.5"/>
  <text x="685" y="66" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">● STATUS</text>
  <text x="685" y="88" text-anchor="middle" font-family="'SF Mono',monospace" font-size="20" fill="#27c93f" font-weight="bold" filter="url(#glowGreen)" class="sp">OPERATIONAL</text>

  <!-- Bottom row -->
  <!-- Threat Level -->
  <rect x="20" y="115" width="370" height="42" rx="4" fill="#0d1520" stroke="#DC143C" stroke-width="0.8" opacity="0.4"/>
  <text x="205" y="134" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">⚠ THREAT ASSESSMENT</text>
  <text x="205" y="150" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#DC143C" font-weight="bold" filter="url(#glow)">CRITICAL · HIGH IMPACT · ARMED</text>

  <!-- Clearance -->
  <rect x="405" y="115" width="375" height="42" rx="4" fill="#0d1520" stroke="#CC7832" stroke-width="0.8" opacity="0.4"/>
  <text x="592" y="134" text-anchor="middle" font-family="'SF Mono',monospace" font-size="11" fill="#6e7681">🔒 SECURITY CLEARANCE</text>
  <text x="592" y="150" text-anchor="middle" font-family="'SF Mono',monospace" font-size="16" fill="#CC7832" font-weight="bold" filter="url(#glow)">ULTRAVIOLET · NEED-TO-KNOW</text>
</svg>