<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="auto">
  <defs>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b11"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>

    <style>
      @keyframes pulse { 0%,100% { opacity:0.7 } 50% { opacity:0.2 } }
      @keyframes scanPulse { 0%,100% { opacity:0.35 } 50% { opacity:0.1 } }
      .p { animation: pulse 2s ease-in-out infinite }
      .sp { animation: scanPulse 3s ease-in-out infinite }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="500" rx="5" fill="url(#bg)"/>
  <rect x="1" y="1" width="698" height="498" rx="5" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#CC7832" filter="url(#glowAmber)">┌─ /intel/threat-matrix ───────────────────────────────────────┐</text>

  <!-- Center at cx=300, cy=290 -->
  <!-- Concentric rings -->
  <circle cx="300" cy="290" r="140" fill="none" stroke="#1a1a2e" stroke-width="0.8"/>
  <circle cx="300" cy="290" r="105" fill="none" stroke="#1a1a2e" stroke-width="0.6"/>
  <circle cx="300" cy="290" r="70" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
  <circle cx="300" cy="290" r="35" fill="none" stroke="#1a1a2e" stroke-width="0.3"/>

  <!-- Pentagon vertices (radius 120 from center 300,290) -->
  <!-- Top: (300, 170) -->
  <!-- Top-right: (300+120*cos(-18°), 290-120*sin(-18°)) ≈ (414, 253) -->
  <!-- Bottom-right: (300+120*cos(54°), 290-120*sin(54°)) ≈ (371, 387) -->
  <!-- Bottom-left: (300-120*cos(54°), 290-120*sin(54°)) ≈ (229, 387) -->
  <!-- Top-left: (300-120*cos(-18°), 290-120*sin(-18°)) ≈ (186, 253) -->

  <!-- Pentagon for 95% top, 90% right, 88% low-right, 92% low-left, 85% left -->
  <!-- Scaled: 95% of 120 = 114  from top -->
  <!-- Top: (300, 290-114) = (300, 176) -->
  <!-- Top-right: (300+0.9*120*cos(-18), 290-0.9*120*sin(-18)) ≈ (300+102.4, 290-32.7) ≈ (402, 257) -->
  <!-- Bottom-right: (300+0.88*120*cos(54), 290+0.88*120*sin(54)) ≈ (300+62.1, 290+85.4) ≈ (362, 375) -->
  <!-- Bottom-left: (300-0.92*120*cos(54), 290+0.92*120*sin(54)) ≈ (300-64.9, 290+89.2) ≈ (235, 379) -->
  <!-- Top-left: (300-0.85*120*cos(-18), 290-0.85*120*sin(-18)) ≈ (300-96.7, 290-30.9) ≈ (203, 259) -->

  <!-- Axis lines -->
  <line x1="300" y1="290" x2="300" y2="155" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="300" y1="290" x2="424" y2="248" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="300" y1="290" x2="378" y2="400" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="300" y1="290" x2="222" y2="400" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="4,4"/>
  <line x1="300" y1="290" x2="176" y2="248" stroke="#1a1a2e" stroke-width="0.6" stroke-dasharray="4,4"/>

  <!-- Data pentagon -->
  <polygon points="300,176 402,257 362,375 235,379 203,259" fill="#00D4FF" opacity="0.08" stroke="#00D4FF" stroke-width="1.5" filter="url(#glowCyan)"/>

  <!-- Scan line -->
  <line x1="300" y1="290" x2="300" y2="150" stroke="#00D4FF" stroke-width="1.2" opacity="0.3" filter="url(#glowCyan)" class="sp">
    <animateTransform attributeName="transform" type="rotate" from="0 300 290" to="360 300 290" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- ===== LABELS pushed well outside pentagon ===== -->

  <!-- OFFENSIVE (top) — vertex at (300,176), label at (300,118) -->
  <text x="300" y="118" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#DC143C" filter="url(#glowRed)">☠ OFFENSIVE</text>
  <text x="300" y="134" text-anchor="middle" font-family="monospace" font-size="10" fill="#00D4FF">95%</text>

  <!-- SYSTEMS (top-right) — vertex at (402,257), label at (442,230) -->
  <text x="442" y="230" text-anchor="start" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#CC7832" filter="url(#glowAmber)">⊞ SYSTEMS</text>
  <text x="442" y="246" text-anchor="start" font-family="monospace" font-size="10" fill="#00D4FF">90%</text>

  <!-- AI/ML (bottom-right) — vertex at (362,375), label at (385,420) -->
  <text x="385" y="420" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#00D4FF" filter="url(#glowCyan)">🧠 AI / ML</text>
  <text x="385" y="436" text-anchor="middle" font-family="monospace" font-size="10" fill="#00D4FF">88%</text>

  <!-- LANGUAGES (bottom-left) — vertex at (235,379), label at (215,420) -->
  <text x="215" y="420" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#27c93f" filter="url(#glowGreen)">💻 LANGUAGES</text>
  <text x="215" y="436" text-anchor="middle" font-family="monospace" font-size="10" fill="#00D4FF">92%</text>

  <!-- INFRA (top-left) — vertex at (203,259), label at (148,230) -->
  <text x="148" y="230" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#6e7681">⚙ INFRA</text>
  <text x="148" y="246" text-anchor="end" font-family="monospace" font-size="10" fill="#00D4FF">85%</text>

  <!-- ===== RIGHT PANEL ===== -->
  <rect x="490" y="55" width="195" height="300" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>

  <text x="587" y="78" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#CC7832" filter="url(#glowAmber)">▌THREAT INDEX</text>

  <line x1="505" y1="86" x2="670" y2="86" stroke="#1a1a2e" stroke-width="0.5"/>

  <!-- Bar 1: OFFENSIVE -->
  <text x="505" y="108" font-family="monospace" font-size="10" fill="#DC143C">OFFENSIVE</text>
  <rect x="505" y="114" width="170" height="14" rx="2" fill="#DC143C" opacity="0.08" stroke="#DC143C" stroke-width="0.5"/>
  <rect x="505" y="114" width="161" height="14" rx="2" fill="#DC143C" opacity="0.35"/>
  <text x="680" y="125" text-anchor="end" font-family="monospace" font-size="10" fill="#DC143C">95%</text>

  <!-- Bar 2: LANGUAGES -->
  <text x="505" y="150" font-family="monospace" font-size="10" fill="#00D4FF">LANGUAGES</text>
  <rect x="505" y="156" width="170" height="14" rx="2" fill="#00D4FF" opacity="0.08" stroke="#00D4FF" stroke-width="0.5"/>
  <rect x="505" y="156" width="156" height="14" rx="2" fill="#00D4FF" opacity="0.35"/>
  <text x="680" y="167" text-anchor="end" font-family="monospace" font-size="10" fill="#00D4FF">92%</text>

  <!-- Bar 3: SYSTEMS -->
  <text x="505" y="192" font-family="monospace" font-size="10" fill="#CC7832">SYSTEMS</text>
  <rect x="505" y="198" width="170" height="14" rx="2" fill="#CC7832" opacity="0.08" stroke="#CC7832" stroke-width="0.5"/>
  <rect x="505" y="198" width="153" height="14" rx="2" fill="#CC7832" opacity="0.35"/>
  <text x="680" y="209" text-anchor="end" font-family="monospace" font-size="10" fill="#CC7832">90%</text>

  <!-- Bar 4: AI/ML -->
  <text x="505" y="234" font-family="monospace" font-size="10" fill="#27c93f">AI / ML</text>
  <rect x="505" y="240" width="170" height="14" rx="2" fill="#27c93f" opacity="0.08" stroke="#27c93f" stroke-width="0.5"/>
  <rect x="505" y="240" width="149" height="14" rx="2" fill="#27c93f" opacity="0.35"/>
  <text x="680" y="251" text-anchor="end" font-family="monospace" font-size="10" fill="#27c93f">88%</text>

  <!-- Bar 5: INFRA -->
  <text x="505" y="276" font-family="monospace" font-size="10" fill="#6e7681">INFRA</text>
  <rect x="505" y="282" width="170" height="14" rx="2" fill="#6e7681" opacity="0.08" stroke="#6e7681" stroke-width="0.5"/>
  <rect x="505" y="282" width="144" height="14" rx="2" fill="#6e7681" opacity="0.35"/>
  <text x="680" y="293" text-anchor="end" font-family="monospace" font-size="10" fill="#6e7681">85%</text>

  <!-- Aggregate -->
  <line x1="505" y1="308" x2="670" y2="308" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="505" y="326" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#6e7681">AGGREGATE</text>
  <text x="680" y="326" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="16" fill="#00D4FF" font-weight="bold" filter="url(#glowCyan)">90%</text>

  <line x1="505" y1="336" x2="670" y2="336" stroke="#1a1a2e" stroke-width="0.5"/>

  <text x="505" y="352" font-family="monospace" font-size="9" fill="#CC7832">THREAT: CRITICAL</text>
  <text x="505" y="368" font-family="monospace" font-size="9" fill="#27c93f">STATUS: OPERATIONAL</text>
  <text x="505" y="384" font-family="monospace" font-size="9" fill="#6e7681">CLASS: ULTRAVIOLET</text>
  <text x="505" y="400" font-family="monospace" font-size="9" fill="#DC143C">CLEARANCE: NOFORN</text>

  <!-- Blips -->
  <circle cx="300" cy="240" r="2" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.7;0.3;0" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="300" r="2" fill="#DC143C" opacity="0"><animate attributeName="opacity" values="0;0.6;0.3;0" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="310" r="1.5" fill="#00D4FF" opacity="0"><animate attributeName="opacity" values="0;0.7;0.2;0" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="370" cy="270" r="1.5" fill="#CC7832" opacity="0"><animate attributeName="opacity" values="0;0.5;0.2;0" dur="5s" repeatCount="indefinite"/></circle>
</svg>