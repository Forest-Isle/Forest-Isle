<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto">
  <defs>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b11"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#CC7832"/>
    </linearGradient>

    <style>
      @keyframes pulse { 0%,100% { opacity:0.8 } 50% { opacity:0.3 } }
      @keyframes shine { 0% { transform:translate(-100,0) } 100% { transform:translate(300,0) } }
      @keyframes earnedPulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
      .p { animation: pulse 2.2s ease-in-out infinite }
      .ep { animation: earnedPulse 1.8s ease-in-out infinite }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="320" rx="5" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="318" rx="5" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#FFD700" filter="url(#glowGold)">┌─ /var/log/achievements ──────────────────────────────────────┐</text>

  <!-- ===== ROW 1: EARNED ===== -->
  <text x="20" y="52" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#27c93f" filter="url(#glowGreen)">◆ EARNED</text>

  <!-- Achievement cards row 1 -->
  <!-- YOLO -->
  <rect x="20" y="62" width="175" height="58" rx="4" fill="#0d1520" stroke="#CC7832" stroke-width="1" opacity="0.6"/>
  <rect x="20" y="62" width="175" height="58" rx="4" fill="url(#goldGrad)" opacity="0.04"/>
  <text x="107" y="82" text-anchor="middle" font-family="monospace" font-size="20" fill="#FFD700" filter="url(#glowGold)">🏴‍☠</text>
  <text x="107" y="98" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#FFD700">YOLO</text>
  <text x="107" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#6e7681">MERGED WITHOUT REVIEW</text>

  <!-- Pull Shark -->
  <rect x="210" y="62" width="175" height="58" rx="4" fill="#0d1520" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
  <rect x="210" y="62" width="175" height="58" rx="4" fill="#00D4FF" opacity="0.03"/>
  <text x="297" y="82" text-anchor="middle" font-family="monospace" font-size="20" fill="#00D4FF" filter="url(#glowCyan)">🦈</text>
  <text x="297" y="98" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#00D4FF">PULL SHARK</text>
  <text x="297" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#6e7681">PRS MERGED</text>

  <!-- Quickdraw -->
