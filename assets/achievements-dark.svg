  <text x="20" y="232" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#CC7832" filter="url(#glowAmber)">◆ IN PROGRESS</text>

  <!-- Galaxy Brain (locked) -->
  <rect x="20" y="244" width="175" height="48" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="107" y="264" text-anchor="middle" font-family="monospace" font-size="18" opacity="0.4">🧠</text>
  <text x="107" y="280" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">GALAXY BRAIN</text>

  <!-- Starstruck (locked) -->
  <rect x="210" y="244" width="175" height="48" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="297" y="264" text-anchor="middle" font-family="monospace" font-size="18" opacity="0.4">⭐</text>
  <text x="297" y="280" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">STARSTRUCK</text>

  <!-- Open Sourcerer (locked) -->
  <rect x="400" y="244" width="175" height="48" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="487" y="264" text-anchor="middle" font-family="monospace" font-size="18" opacity="0.4">🔮</text>
  <text x="487" y="280" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">OPEN SOURCERER</text>

