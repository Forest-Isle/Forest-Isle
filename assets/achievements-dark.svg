  <rect x="590" y="244" width="190" height="48" rx="4" fill="#0d1520" stroke="#1a1a2e" stroke-width="0.8"/>
  <text x="685" y="264" text-anchor="middle" font-family="monospace" font-size="18" opacity="0.4">❄️</text>
  <text x="685" y="280" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">ARCTIC CODE VAULT</text>

  <!-- Progress bar -->
  <text x="400" y="314" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="#6e7681">ACHIEVEMENTS: 5/9 · PROGRESS: 55% · RANK: ELITE</text>
