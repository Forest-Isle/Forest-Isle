  <text x="685" y="82" text-anchor="middle" font-family="monospace" font-size="20" fill="#27c93f" filter="url(#glowGreen)">👥</text>
  <text x="685" y="98" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#27c93f">PAIR EXTRAORDINAIRE</text>
  <text x="685" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#6e7681">CO-AUTHORED COMMITS</text>

  <!-- ROW 1.5: Heart -->
  <rect x="20" y="132" width="175" height="58" rx="4" fill="#0d1520" stroke="#CC7832" stroke-width="1" opacity="0.6"/>
  <rect x="20" y="132" width="175" height="58" rx="4" fill="#CC7832" opacity="0.03"/>
  <text x="107" y="152" text-anchor="middle" font-family="monospace" font-size="20" fill="#CC7832" filter="url(#glowAmber)">❤️</text>
  <text x="107" y="168" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#CC7832">HEART ON SLEEVE</text>
  <text x="107" y="182" text-anchor="middle" font-family="monospace" font-size="8" fill="#6e7681">❤️ REACTION USED</text>

