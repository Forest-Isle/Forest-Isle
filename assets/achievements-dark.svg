  <rect x="400" y="62" width="175" height="58" rx="4" fill="#DC143C" opacity="0.03"/>
  <text x="487" y="82" text-anchor="middle" font-family="monospace" font-size="20" fill="#DC143C" filter="url(#glowRed)">⚡</text>
  <text x="487" y="98" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="#DC143C">QUICKDRAW</text>
  <text x="487" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#6e7681">CLOSED IN &lt; 5 MIN</text>

