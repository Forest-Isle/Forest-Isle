  <rect x="150" y="176" width="600" height="2" rx="1" fill="#0969da" opacity="0.3"/>

  <text x="28" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#953800">root</text>
  <text x="58" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#656d76">@</text>
