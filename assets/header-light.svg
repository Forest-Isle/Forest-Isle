  <text x="186" y="224" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#1f2328"># cat /etc/motd</text>

  <text x="28" y="256" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#656d76">▸ the stack is deep. i live between the kernel &amp; the void.</text>
  <text x="28" y="278" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#0969da">▸ building things that think. breaking things that defend.</text>
  <text x="28" y="300" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#656d76">▸ low-level by choice. high-impact by design.</text>

