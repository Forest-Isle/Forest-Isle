  <rect x="160" y="168" width="580" height="2" rx="1" fill="#0969da" opacity="0.4"/>

  <text x="24" y="210" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#953800">root</text>
  <text x="56" y="210" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#656d76">@</text>
