<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="auto">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal background -->
  <rect x="0" y="0" width="800" height="260" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="32" rx="8" fill="#f6f8fa"/>
  <rect x="0" y="16" width="800" height="16" fill="#f6f8fa"/>

  <!-- Traffic lights -->
  <circle cx="16" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="36" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="12" fill="#656d76">root@forest-isle:~</text>

  <!-- Content -->
  <text x="24" y="68" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#953800">root</text>
  <text x="56" y="68" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#1f2328">@</text>
  <text x="68" y="68" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#0969da" font-weight="bold">forest-isle</text>
  <text x="168" y="68" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#953800">:~</text>
  <text x="188" y="68" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#1f2328"># whoami</text>

  <!-- Forest Isle big name -->
  <text x="400" y="116" text-anchor="middle" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="36" fill="#0969da" font-weight="700" filter="url(#glow)">Forest Isle</text>

  <!-- Prompt line 2 -->
  <text x="24" y="164" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#953800">root</text>
  <text x="56" y="164" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#1f2328">@</text>
  <text x="68" y="164" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#0969da" font-weight="bold">forest-isle</text>
  <text x="168" y="164" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#953800">:~</text>
  <text x="188" y="164" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#1f2328"># cat /etc/motd</text>

  <!-- Motd -->
  <text x="24" y="200" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#656d76">the stack is deep. i live between the kernel and the void.</text>
  <text x="24" y="222" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#656d76">building things that think. breaking things that defend.</text>

  <!-- Cursor -->
  <rect x="24" y="236" width="10" height="14" fill="#0969da" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>