<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Center diamond -->
  <polygon points="400,2 412,12 400,22 388,12" fill="none" stroke="#00D4FF" stroke-width="1.2" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Left line -->
  <line x1="10" y1="12" x2="384" y2="12" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="10" y1="12" x2="384" y2="12" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Right line -->
  <line x1="416" y1="12" x2="790" y2="12" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="416" y1="12" x2="790" y2="12" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Small dots -->
  <circle cx="392" cy="12" r="1" fill="#00D4FF" opacity="0.4"/>
  <circle cx="408" cy="12" r="1" fill="#00D4FF" opacity="0.4"/>
</svg>